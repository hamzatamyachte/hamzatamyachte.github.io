<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0b1a">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
<link rel="icon" href="{{avatar}}">
<script>
  // Restore the collapsed side bar before first paint.
  try { if (localStorage.getItem('menu') === 'collapsed') document.documentElement.classList.add('collapsed'); } catch (e) {}
</script>
<style>
  :root {
    --bg: #0b0b1a;
    --side: #121027;
    --card: #1a1733;
    --card-hover: #242047;
    --line: #26224a;
    --text: #f4f6ff;
    --dim: #8a8fb8;
    --accent: #3ef0ff;
    --violet: #b39dff;
    --font: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f3fa;
      --side: #ffffff;
      --card: #ffffff;
      --card-hover: #eaeaf6;
      --line: #e1e1ee;
      --text: #14132b;
      --dim: #5c5f82;
      --accent: #0a8fa0;
      --violet: #6a4fd8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Phone: profile, then the menu, then the details. */
  .page {
    display: grid; gap: 32px; max-width: 560px; margin: 0 auto;
    grid-template-areas: "hero" "menu" "details";
    padding: calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  .page > * { min-width: 0; }
  .hero { grid-area: hero; }
  .menu { grid-area: menu; }
  .details { grid-area: details; }

  .hero { display: flex; align-items: center; gap: 20px; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; flex: none; object-fit: cover; background: var(--card); }
  h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -0.5px; line-height: 1.1; }
  .role { margin: 0; font-size: 16px; }
  .meta { margin: 6px 0 0; color: var(--dim); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .meta svg { width: 14px; height: 14px; flex: none; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .links a {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line); text-decoration: none; font-size: 14px; font-weight: 600;
  }
  .links a:hover { background: var(--card-hover); }

  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 12px; }
  .details section + section { margin-top: 32px; }
  .details p { margin: 0 0 12px; font-size: 16px; line-height: 1.55; max-width: 62ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .chips li { padding: 6px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }

  /* Menu: section heading with icon tile, items below. */
  #games { --c: var(--accent); }
  #apps { --c: var(--violet); }
  .group + .group { margin-top: 20px; }
  .head {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px; margin: 0 0 8px;
    border: 0; border-radius: 14px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .head:hover { background: var(--card-hover); }
  .tile {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; flex: none;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
    transition: box-shadow .15s, background .15s;
  }
  .tile svg { width: 20px; height: 20px; }
  .label { font-size: 16px; font-weight: 700; }
  .count { font-size: 12px; font-weight: 600; color: var(--dim); padding: 2px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .arrow { width: 16px; height: 16px; margin-left: auto; color: var(--dim); transition: transform .2s; }
  .folded .arrow { transform: rotate(-90deg); }
  .folded .fly { display: none; }
  .fly-title { display: none; }
  .list { display: grid; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px;
    background: var(--card); text-decoration: none; transition: background .15s, transform .15s;
  }
  .item:hover { background: var(--card-hover); }
  .item:active { transform: scale(.98); }
  .item img { width: 44px; height: 44px; border-radius: 11px; flex: none; }
  .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name { font-size: 15px; font-weight: 700; }
  .desc { color: var(--dim); font-size: 13px; line-height: 1.35; }
  .toggle { display: none; }

  .intro { color: var(--dim); font-size: 14px !important; }
  h2 .count { margin-left: 6px; letter-spacing: 0; vertical-align: 1px; }
  .repos { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .repo {
    --c: var(--accent);
    display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 16px; min-width: 0;
    background: var(--card); border: 1px solid var(--line); text-decoration: none;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .repo.tooling { --c: var(--violet); }
  .repo:hover { border-color: var(--c); transform: translateY(-2px); }
  .repo .tile { width: 36px; height: 36px; border-radius: 10px; }
  .repo .tile svg { width: 18px; height: 18px; }
  .repo .text { flex: 1; }
  .repo .name { overflow-wrap: anywhere; }
  .kind { font-size: 12px; font-weight: 600; color: var(--c); }
  .repo .desc { margin-top: 4px; }
  .out { width: 16px; height: 16px; flex: none; color: var(--dim); opacity: .45; transition: opacity .15s, color .15s, transform .15s; }
  .repo:hover .out { opacity: 1; color: var(--c); transform: translate(2px, -2px); }

  .tip { display: flex; gap: 10px; color: var(--dim); font-size: 13px; line-height: 1.45; margin: 24px 0 0; }
  .tip svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

  /* Wide screens: the menu becomes a fixed side bar. */
  @media (min-width: 860px) {
    .page {
      max-width: none; margin: 0; padding: 0; gap: 0 56px;
      grid-template-columns: var(--side-w, 304px) minmax(0, 760px);
      grid-template-rows: auto 1fr;
      grid-template-areas: "menu hero" "menu details";
      transition: grid-template-columns .22s ease;
    }
    .menu {
      position: sticky; top: 0; align-self: start; height: 100dvh; overflow-y: auto; z-index: 2;
      display: flex; flex-direction: column;
      padding: 20px 16px; background: var(--side); border-right: 1px solid var(--line);
    }
    .item { background: none; padding: 8px; }
    .tip { margin-top: auto; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .toggle {
      display: grid; place-items: center; width: 40px; height: 40px; margin: 0 0 16px 6px; flex: none;
      border: 0; border-radius: 12px; background: none; color: var(--dim); cursor: pointer;
    }
    .toggle:hover { background: var(--card-hover); color: var(--text); }
    .toggle svg { width: 20px; height: 20px; }
    .hero { padding: 64px 32px 40px 0; gap: 28px; }
    .details { padding: 0 32px 64px 0; }
    .avatar { width: 128px; height: 128px; }
    h1 { font-size: 40px; }

    /* Collapsed: a rail with one icon per section, items in a flyout. */
    .collapsed .page { --side-w: 72px; }
    .collapsed .menu { overflow: visible; padding: 20px 10px; align-items: center; }
    .collapsed .toggle { margin: 0 0 16px; }
    .collapsed .label, .collapsed .menu .count, .collapsed .arrow, .collapsed .tip { display: none; }
    .collapsed .group { position: relative; margin: 0 0 8px; }
    .collapsed .head { width: auto; padding: 6px; margin: 0; }
    .collapsed .group:hover .head, .collapsed .group.open .head { background: none; }
    .collapsed .group:hover .tile, .collapsed .group.open .tile, .collapsed .head:focus-visible .tile {
      background: color-mix(in srgb, var(--c) 24%, transparent); box-shadow: 0 0 0 2px var(--c);
    }
    .collapsed .fly {
      display: block; position: absolute; left: 100%; top: -8px; width: 316px; padding-left: 14px;
      opacity: 0; visibility: hidden; transform: translateX(-6px); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .28));
      transition: opacity .16s, transform .16s, visibility .16s;
    }
    .collapsed .fly > * { background: var(--side); }
    .collapsed .fly-title {
      display: block; margin: 0; padding: 16px 18px 8px; border: 1px solid var(--line); border-bottom: 0;
      border-radius: 18px 18px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--c);
    }
    .collapsed .fly .list {
      gap: 2px; padding: 0 8px 8px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px;
    }
    .collapsed .group:hover .fly, .collapsed .group:focus-within .fly, .collapsed .group.open .fly {
      opacity: 1; visibility: visible; transform: none;
    }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
<!--HERO-->
<!--MENU-->
<!--DETAILS-->
</div>
<script>
  (function () {
    var root = document.documentElement, btn = document.querySelector('.toggle');
    var groups = Array.prototype.slice.call(document.querySelectorAll('.group'));
    function collapsed() { return root.classList.contains('collapsed') && matchMedia('(min-width: 860px)').matches; }
    function closeAll(except) { groups.forEach(function (g) { if (g !== except) g.classList.remove('open'); }); }
    function sync() {
      var label = root.classList.contains('collapsed') ? 'Expand menu' : 'Collapse menu';
      btn.setAttribute('aria-expanded', String(!root.classList.contains('collapsed')));
      btn.setAttribute('aria-label', label);
      btn.title = label;
      groups.forEach(function (g) {
        var open = collapsed() ? g.classList.contains('open') : !g.classList.contains('folded');
        g.querySelector('.head').setAttribute('aria-expanded', String(open));
      });
    }
    btn.addEventListener('click', function () {
      var now = root.classList.toggle('collapsed');
      closeAll();
      try { localStorage.setItem('menu', now ? 'collapsed' : 'open'); } catch (e) {}
      sync();
    });
    // Heading: pins the flyout on the rail, folds the section otherwise.
    groups.forEach(function (g) {
      g.querySelector('.head').addEventListener('click', function () {
        if (collapsed()) { closeAll(g); g.classList.toggle('open'); } else { g.classList.toggle('folded'); }
        sync();
      });
    });
    document.addEventListener('click', function (e) { if (!e.target.closest('.group')) { closeAll(); sync(); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeAll(); sync(); } });
    sync();
  })();
</script>
</body>
</html>
